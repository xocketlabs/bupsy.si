name: Bupsy
options:
  bundleIdPrefix: si.bupsy
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  BupsyKit:
    path: Packages/BupsyKit
  # Auto-updates. Sparkle verifies every update with an EdDSA signature we hold, so a
  # compromised download host cannot push a modified build to anyone.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

targets:
  BupsyMac:
    type: application
    platform: macOS
    sources:
      - path: Apps/BupsyMac/Sources
      # The asset catalogue holds the app icon. Without it bupsy shipped with macOS's blank
      # default icon in the Dock and Finder.
      - path: Apps/BupsyMac/Resources
    dependencies:
      - package: BupsyKit
        product: BupsyKit
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_NAME: Bupsy
        PRODUCT_BUNDLE_IDENTIFIER: si.bupsy.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        # Talking to a bot instead of typing. macOS shows these when it asks the person.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Bupsy listens only while the microphone button in a chat is on, so you can talk to a bot instead of typing."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "What you say is turned into text for your message, on this Mac whenever your language allows."
        CODE_SIGN_ENTITLEMENTS: Apps/BupsyMac/Bupsy.entitlements
        # No SUFeedURL yet, on purpose. Distribution is GitHub Releases only for now, and
        # Sparkle polling a feed that does not exist would fail quietly in the background
        # forever — a broken update channel is worse than an honest absence of one. Until a
        # public appcast is hosted, "Check for Updates" opens the releases page instead.
        # scripts/appcast.sh already produces the feed; turning this on is one line plus a host.
        INFOPLIST_KEY_SUEnableAutomaticChecks: NO
        # App Sandbox is OFF, and must stay off: a sandboxed app cannot spawn the
        # user-installed `claude` / `codex` binaries, which is the entire premise.
        # This is why Bupsy ships via Developer ID rather than the Mac App Store.
        # See docs/00-compliance-and-auth.md.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        # The build phase below runs Go from the repo and writes into the app bundle, which
        # Xcode's script sandbox forbids.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # bupsy-mcp — the tool server that lets bots message, list and create other bots — is Go,
      # and the app looks for it inside its own bundle. Nothing used to put it there, so every
      # real build ran without it and those tools silently did not exist. Built universal, like
      # the app, and never vendored as a prebuilt binary: what ships is what this commit says.
      - name: Build bupsy-mcp
        basedOnDependencyAnalysis: false
        script: |
          set -e
          GO="$(command -v go || true)"
          for candidate in /opt/homebrew/bin/go /usr/local/go/bin/go /usr/local/bin/go; do
            [ -z "$GO" ] && [ -x "$candidate" ] && GO="$candidate"
          done
          if [ -z "$GO" ]; then
            echo "warning: Go not found — this build cannot let bots message or create other bots. Install Go (brew install go)."
            exit 0
          fi
          cd "$SRCROOT/Tools/bupsy-run"
          OUT="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH"
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 "$GO" build -trimpath -o "$DERIVED_FILE_DIR/bupsy-mcp-arm64" ./cmd/bupsy-mcp
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 "$GO" build -trimpath -o "$DERIVED_FILE_DIR/bupsy-mcp-amd64" ./cmd/bupsy-mcp
          lipo -create "$DERIVED_FILE_DIR/bupsy-mcp-arm64" "$DERIVED_FILE_DIR/bupsy-mcp-amd64" -output "$OUT/bupsy-mcp"

  # The iPhone app. It talks to Bupsy on the person's Mac only through the remote API that
  # Apps/BupsyMac/Sources/RemoteAccess.swift serves over Tailscale, so it shares no code with
  # BupsyKit, which links GRDB and macOS-only APIs. The API is the contract between the two.
  BupsyiOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/BupsyiOS/Sources
      - path: Apps/BupsyiOS/Resources
    # A scheme of its own so `xcodebuild test -scheme BupsyiOS` runs the client's tests.
    scheme:
      testTargets:
        - BupsyiOSTests
    settings:
      base:
        PRODUCT_NAME: Bupsy
        PRODUCT_BUNDLE_IDENTIFIER: si.bupsy.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # iPhone only for now: the layout is one column, and an iPad deserves the two-pane one.
        TARGETED_DEVICE_FAMILY: "1"
        # Signing is left to whoever builds for a device: set your team in Xcode, or pass
        # DEVELOPMENT_TEAM. The simulator and CI build with CODE_SIGNING_ALLOWED=NO.
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Apps/BupsyiOS/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Bupsy
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSCameraUsageDescription: Bupsy uses the camera to scan the pairing code your Mac shows.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Bupsy checks it's you before a bot is allowed to do something on your Mac.

  BupsyiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Apps/BupsyiOS/Tests
    dependencies:
      - target: BupsyiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: si.bupsy.ios.tests
        # The app's product is "Bupsy", not its target's name, which xcodegen would assume.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Bupsy.app/Bupsy
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
