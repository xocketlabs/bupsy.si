name: CI

# Private repos pay for Actions by the minute, and macOS minutes count ten times. So CI runs on
# pull requests only — a squash merge puts exactly the tested code on main, and running it all
# again there doubled the bill for no new information — and skips changes that cannot break a
# build. Run it by hand from the Actions tab for a dev DMG, ticking "portable" for the Linux check.
on:
  pull_request:
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**/*.md"
      - "**/*.png"
      - "LICENSE"
      - "NOTICE"
  workflow_dispatch:
    inputs:
      portable:
        description: "Also try the Linux build (informational; stops at GRDB, uses paid minutes)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every `uses:` is pinned to a full commit SHA, with the release it came from in a comment. A tag
# is a pointer the action's owner (or whoever compromises them) can move, and these steps run with
# this repository's token on our own Mac. Dependabot understands SHA pins and keeps them current,
# so pinning costs nothing but a reviewed diff per bump.
#
# Jobs that can land on the self-hosted runner (MAC_RUNNER) skip pull requests opened by
# Dependabot. A dependency bump executes new upstream code — a new action, a new Swift package
# with its build plugins and tests — and that must not run unattended on someone's personal
# machine. Review the diff, then run CI by hand (Actions → CI → Run workflow, on the Dependabot
# branch); a manual run is started by a person, so it is not skipped. The repository is private,
# so other pull requests come only from collaborators, who are trusted to run code here anyway.
# A skipped job reports as passing to branch protection, which is why the manual run before
# merging is the rule rather than a nicety.
jobs:
  # The package tests and the app build share one macOS machine. Two jobs meant paying twice for
  # checkout, toolchain start-up and minute rounding, at ten times the Linux rate.
  #
  # The app build is here because adding one case to an enum in BupsyKit once broke two exhaustive
  # switches in the app while CI stayed green: every job built the package, none built the thing
  # people actually run. The project file is generated, so it is regenerated rather than committed —
  # a stale checked-in project silently omits new files.
  mac:
    name: Test BupsyKit and build the app
    # A hung test must not hold the one self-hosted runner — and every PR behind it — for hours.
    timeout-minutes: 20
    # MAC_RUNNER picks the machine: unset → GitHub's macos-15; set to ["self-hosted","bupsy-mac"]
    # → the runner on our own Mac, which costs no Actions minutes.
    runs-on: ${{ fromJSON(vars.MAC_RUNNER || '"macos-15"') }}
    # Not for Dependabot: see the note above `jobs:`.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: swift --version

      # --force-resolved-versions builds exactly what Package.resolved pins, and fails rather than
      # quietly resolving something newer. A dependency changes only through a reviewed commit.
      - name: Test
        run: swift test --package-path Packages/BupsyKit --force-resolved-versions

      # Its own step, so the log says plainly which thing broke: "the Swift core stopped agreeing
      # with the shared definition" is a different failure from an ordinary test going red.
      - name: Conformance
        run: swift test --package-path Packages/BupsyKit --force-resolved-versions --filter Conformance

      - name: Install xcodegen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Build the app
        run: |
          set -o pipefail
          xcodegen generate
          # Compile errors are also posted as annotations, so they show on the PR's Files tab
          # (and through the API) without anyone having to open the raw log.
          # Its own build folder beside the checkout, not Xcode's shared DerivedData: on a runner
          # that is someone's Mac, a Bupsy.app there shows up in Spotlight and Open With next to
          # the real one, and every run put it back. Beside the checkout so it survives the
          # checkout's clean and builds stay incremental.
          xcodebuild -project Bupsy.xcodeproj -scheme BupsyMac \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/../bupsy-dd" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | tail -20 || {
            grep -E '^/.*: error: ' build.log | sort -u | head -40 | while IFS= read -r line; do
              file="${line%%:*}"; rest="${line#*:}"; lineno="${rest%%:*}"
              echo "::error file=${file#"$GITHUB_WORKSPACE"/},line=${lineno}::${line##*: error: }"
            done
            exit 1
          }

      # The iPhone app shares no code with the Mac app, only the remote API, so nothing else here
      # would notice it breaking. Built for the simulator, unsigned; its tests need a simulator
      # runtime, so they run locally (xcodebuild test -scheme BupsyiOS) rather than on every PR.
      # Same build folder as the Mac app, so the clean-up step below removes this copy too.
      - name: Build the iPhone app
        run: |
          set -o pipefail
          xcodebuild -project Bupsy.xcodeproj -scheme BupsyiOS \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$GITHUB_WORKSPACE/../bupsy-dd" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-ios.log | tail -20 || {
            grep -E '^/.*: error: ' build-ios.log | sort -u | head -40 | while IFS= read -r line; do
              file="${line%%:*}"; rest="${line#*:}"; lineno="${rest%%:*}"
              echo "::error file=${file#"$GITHUB_WORKSPACE"/},line=${lineno}::${line##*: error: }"
            done
            exit 1
          }

      # Only on a manual run: a dev DMG anyone with access can download from the run's Artifacts.
      - name: Package a DMG
        if: github.event_name == 'workflow_dispatch'
        run: ./scripts/package.sh "0.0.0-dev.${GITHUB_SHA::7}"

      - name: Upload the DMG
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Bupsy-${{ github.sha }}
          path: |
            build/Bupsy-*.dmg
            build/Bupsy-*.dmg.sha256
          retention-days: 30

      # Leave no Bupsy.app behind on the runner, built or packaged, and tell macOS they are gone:
      # this runner is a Mac someone uses, and they should only ever find the Bupsy they installed.
      - name: Remove built copies of the app
        if: always()
        run: |
          LSR=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          for app in "$GITHUB_WORKSPACE"/../bupsy-dd/Build/Products/*/Bupsy.app \
                     "$GITHUB_WORKSPACE"/build/dd/Build/Products/*/Bupsy.app \
                     "$GITHUB_WORKSPACE"/build/staging/Bupsy.app; do
            [ -e "$app" ] || continue
            "$LSR" -u "$app" 2>/dev/null || true
            rm -rf "$app"
          done

  # The headless core. Runs on Linux because that is the point of it existing — the Swift core's
  # SQLite layer does not link there, and cloud machines do.
  #
  # The conformance step is listed separately from the unit tests for the same reason it is on the
  # Swift job: "the Go core stopped agreeing with the shared definition" is a different kind of
  # failure from a test going red, and the log should say which happened without anyone opening it.
  core:
    name: Headless core (Go)
    # Plain Go with no cgo, so it runs anywhere; on the Mac runner when that is set.
    runs-on: ${{ fromJSON(vars.MAC_RUNNER || '"ubuntu-latest"') }}
    # Not for Dependabot: see the note above `jobs:`.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
          # No cache path, because there is nothing to cache: this module has no dependencies and
          # no go.sum. That is deliberate — the core drives other people's binaries and parses
          # their output, and the standard library covers all of it. Adding a dependency here
          # means adding something that can be compromised between us and a user's machine.
          cache: false

      - name: Formatting
        working-directory: Tools/bupsy-run
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change: $unformatted"
            exit 1
          fi
          echo "clean"

      - name: Vet
        working-directory: Tools/bupsy-run
        run: go vet ./...

      - name: Build
        working-directory: Tools/bupsy-run
        run: go build ./...

      # Bupsy for Windows and Linux, built for every platform it is meant for. Seconds of work with
      # no cgo, and the only check that the Windows-only files (process trees, batch-file shims)
      # still compile, since no job runs on Windows. Built to /dev/null, so no copy of the app is
      # left on the runner.
      - name: Build the desktop app for every platform
        working-directory: Tools/bupsy-run
        env:
          CGO_ENABLED: "0"
        run: |
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/arm64 darwin/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/bupsy-desktop
            echo "built $target"
          done
          GOOS=windows go vet ./...

      - name: Test
        working-directory: Tools/bupsy-run
        run: go test ./...

      - name: Conformance
        working-directory: Tools/bupsy-run
        run: go test ./internal/conformance/ -v

  # Proves our own code carries no hidden Apple dependency. It has already earned its keep twice:
  # it found that URLSession lives in FoundationNetworking off-Apple, and that
  # FileHandle.bytes.lines — the call draining every agent process — does not exist outside
  # Darwin at all. Both are fixed.
  #
  # What it cannot get past is GRDB, which fails to LINK on Linux (undefined sqlite3_snapshot_*).
  # GRDB's own README says Linux support is contributor-provided, untested and unmaintained, and
  # its CI runs macOS only. That is a dependency problem rather than ours, and it is the real
  # finding: our Swift is portable; the SQLite layer under it is not.
  #
  # Left informational on purpose. It is a tripwire for our own code, not a promise about a port.
  portable:
    name: Core builds without Apple frameworks
    runs-on: ubuntu-latest
    # Informational, and it always stops at GRDB. It is also the one job on GitHub's own
    # machines, billed by the minute, so a manual run for a dev DMG skips it unless the box is
    # ticked: a known failure is not worth paid minutes or a red run.
    if: github.event_name == 'workflow_dispatch' && inputs.portable
    continue-on-error: true   # informational until a port is actually committed to
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: "6.0"
      - name: Build BupsyKit
        run: swift build --package-path Packages/BupsyKit --force-resolved-versions
      - name: Test BupsyKit
        run: swift test --package-path Packages/BupsyKit --force-resolved-versions

  # The website's functions (waitlist, contact, MCP server, Markdown for agents) and its
  # machine-readable files, with Node's own test runner: no dependencies to install.
  site:
    name: Website functions
    runs-on: ${{ fromJSON(vars.MAC_RUNNER || '"ubuntu-latest"') }}
    # Not for Dependabot: see the note above `jobs:`.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        run: node --test tests/site/*.test.mjs

  boundaries:
    name: Credential boundary
    runs-on: ${{ fromJSON(vars.MAC_RUNNER || '"ubuntu-latest"') }}
    # Not for Dependabot: see the note above `jobs:`.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The rule from CONTRIBUTING.md §1, enforced rather than trusted: nothing in this
      # codebase may read a vendor credential file. Keep this grep narrow and loud.
      - name: No code reads a credential path
        run: |
          if grep -rnE '\.claude/\.credentials|\.codex/auth\.json|CLAUDE_CODE_OAUTH_TOKEN|setup-token' \
               --include='*.swift' --include='*.go' Packages/ Apps/ Tools/ 2>/dev/null; then
            echo "::error::Source references a vendor credential path. See docs/00-compliance-and-auth.md"
            exit 1
          fi
          echo "clean"

      - name: No vendor marks in product naming
        run: |
          if grep -rniE '\b(claude|anthropic|openai|codex|grok|xai)(kit|app|bot)\b' \
               --include='*.swift' --include='*.go' Packages/ Apps/ Tools/ 2>/dev/null; then
            echo "::error::Vendor mark used in a product or type name. See compliance doc §5."
            exit 1
          fi
          echo "clean"
