name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test BupsyKit
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build --package-path Packages/BupsyKit

      - name: Test
        run: swift test --package-path Packages/BupsyKit

      # Its own step, so the log says plainly which thing broke. These are the cases every
      # implementation must pass, and "the Swift one stopped agreeing with the shared
      # definition" is a different kind of failure from an ordinary test going red.
      - name: Conformance
        run: swift test --package-path Packages/BupsyKit --filter Conformance

  # Proves our own code carries no hidden Apple dependency. It has already earned its keep twice:
  # it found that URLSession lives in FoundationNetworking off-Apple, and that
  # FileHandle.bytes.lines — the call draining every agent process — does not exist outside
  # Darwin at all. Both are fixed.
  #
  # What it cannot get past is GRDB, which fails to LINK on Linux (undefined sqlite3_snapshot_*).
  # GRDB's own README says Linux support is contributor-provided, untested and unmaintained, and
  # its CI runs macOS only. That is a dependency problem rather than ours, and it is the real
  # finding: our Swift is portable; the SQLite layer under it is not.
  #
  # Left informational on purpose. It is a tripwire for our own code, not a promise about a port.
  portable:
    name: Core builds without Apple frameworks
    runs-on: ubuntu-latest
    continue-on-error: true   # informational until a port is actually committed to
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Build BupsyKit
        run: swift build --package-path Packages/BupsyKit
      - name: Test BupsyKit
        run: swift test --package-path Packages/BupsyKit

  boundaries:
    name: Credential boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The rule from CONTRIBUTING.md §1, enforced rather than trusted: nothing in this
      # codebase may read a vendor credential file. Keep this grep narrow and loud.
      - name: No code reads a credential path
        run: |
          if grep -rnE '\.claude/\.credentials|\.codex/auth\.json|CLAUDE_CODE_OAUTH_TOKEN|setup-token' \
               --include='*.swift' Packages/ Apps/ 2>/dev/null; then
            echo "::error::Source references a vendor credential path. See docs/00-compliance-and-auth.md"
            exit 1
          fi
          echo "clean"

      - name: No vendor marks in product naming
        run: |
          if grep -rniE '\b(claude|anthropic|openai|codex|grok|xai)(kit|app|bot)\b' \
               --include='*.swift' Packages/ Apps/ 2>/dev/null; then
            echo "::error::Vendor mark used in a product or type name. See compliance doc §5."
            exit 1
          fi
          echo "clean"
