name: Release

# Push a tag like v0.1.0 to publish. Or run it by hand from the Actions tab, which defaults to a
# *draft* so the whole pipeline can be checked without anything becoming visible to anyone.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, e.g. 0.1.0
        required: true
      draft:
        description: Publish as a draft (only visible to the repo's collaborators)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # GitHub's own Mac, never a self-hosted one: see the note at the top of ci.yml.
    runs-on: macos-15
    env:
      # Whether the Apple signing secrets exist. Signed and unsigned builds share every step but
      # these, so a release ships today and becomes notarized the day the secrets are added —
      # no workflow change needed.
      HAS_SIGNING: ${{ secrets.CERTIFICATE_P12 != '' }}
      HAS_SPARKLE: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The typed-in version arrives through the environment, never spliced into the script:
      # `${{ }}` is pasted in as shell source before bash runs, so a "version" containing quotes or
      # $(...) would have been executed on the release machine with the signing secrets nearby.
      # It is then held to plain x.y.z, because it names files, a tag and a release, and
      # package.sh and appcast.sh take it as given.
      # The runner image holds several Xcodes and defaults to an older one; Bupsy is built with
      # the current Swift, so use the newest released (non-beta) Xcode there is.
      - name: Use the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      # Go builds bupsy-mcp, the tool bots use to talk to Bupsy, inside the app build. On GitHub's
      # Macs Go is installed but not on the PATH the build sees, so put it there explicitly.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
          cache: false

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            DRAFT="$INPUT_DRAFT"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            DRAFT=false
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3, got: $VERSION"
            exit 1
          fi
          if [ "$DRAFT" != true ] && [ "$DRAFT" != false ]; then
            echo "::error::draft must be true or false, got: $DRAFT"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION (draft: $DRAFT, signed: $HAS_SIGNING)"

      - name: Install xcodegen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      # Tests gate the release. A build of broken code is worse than no build: it is the one
      # people actually install.
      #
      # --force-resolved-versions builds exactly what Package.resolved pins, so a release never
      # picks up a dependency version no commit ever reviewed.
      - name: Test
        run: swift test --package-path Packages/BupsyKit --force-resolved-versions

      # A keychain created for this run and deleted after it, so the certificate never lingers on
      # a shared runner.
      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          # Added to the search list, not replacing it: on a self-hosted runner this is
          # someone's own Mac, and replacing the list would drop their keychains. The original
          # list is saved and put back by the clean-up step.
          #
          # Saved one path per line and read back into an array, never word-split: a keychain
          # path with a space in it ("~/Library/Keychains/Work Stuff.keychain-db") would otherwise
          # become two bogus entries and the person's real keychain would drop off the list.
          security list-keychains -d user \
            | sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//' > "$RUNNER_TEMP/keychains.orig"
          ORIGINAL=()
          while IFS= read -r path; do
            if [ -n "$path" ]; then ORIGINAL+=("$path"); fi
          done < "$RUNNER_TEMP/keychains.orig"
          security list-keychains -d user -s "$KEYCHAIN" ${ORIGINAL[@]+"${ORIGINAL[@]}"}
          rm -f "$RUNNER_TEMP/cert.p12"

      # package.sh picks its mode from which secrets are set: all four → signed and notarized,
      # none → ad-hoc signed. Some but not all is an error, never a silent downgrade.
      - name: Build the DMG
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.value }}
        run: ./scripts/package.sh "$VERSION"

      # The app build only warns and carries on when Go is missing (project.yml's post-build
      # script exits 0), because a developer without Go should still be able to build the app.
      # A release is different: without bupsy-mcp, bots cannot message, list or create other bots,
      # and nothing in the app says why. So the release checks for it and refuses to ship without.
      - name: Check bupsy-mcp is in the app
        run: |
          set -euo pipefail
          MCP="build/dd/Build/Products/Release/Bupsy.app/Contents/MacOS/bupsy-mcp"
          if [ ! -x "$MCP" ]; then
            echo "::error::$MCP is missing. Install Go on the release machine and run again."
            exit 1
          fi
          # Built universal like the app; a one-architecture binary would fail on half of Macs.
          ARCHS=$(lipo -archs "$MCP")
          for arch in arm64 x86_64; do
            case " $ARCHS " in
              *" $arch "*) ;;
              *) echo "::error::bupsy-mcp lacks $arch (has: $ARCHS)"; exit 1 ;;
            esac
          done
          echo "bupsy-mcp present ($ARCHS)"

      # Sparkle will not install an update whose EdDSA signature does not verify, so this step is
      # what makes the update channel safe rather than merely convenient. Only meaningful for a
      # notarized build; skipped otherwise.
      - name: Sign the update for Sparkle
        id: sign_update
        if: env.HAS_SIGNING == 'true' && env.HAS_SPARKLE == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          # pipefail, because the signature comes out of a pipe: without it a sign_update that
          # crashed would leave sed's success as the result, and an empty signature would go into
          # the appcast — an update every installed copy then refuses, with nothing failing here.
          set -euo pipefail
          SPARKLE_BIN=$(find build -name sign_update -type f 2>/dev/null | head -1)
          if [ -z "$SPARKLE_BIN" ]; then
            echo "::warning::sign_update not found — skipping the appcast"
            exit 0
          fi
          # Readable only by us, and gone however this step ends.
          trap 'rm -f "$RUNNER_TEMP/sparkle_key"' EXIT
          (umask 077; printf '%s\n' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_key")
          SIG=$("$SPARKLE_BIN" "build/Bupsy-$VERSION.dmg" \
                 -f "$RUNNER_TEMP/sparkle_key" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          if [ -z "$SIG" ]; then
            echo "::error::sign_update produced no signature, so there is no appcast to publish."
            exit 1
          fi
          echo "signature=$SIG" >> "$GITHUB_OUTPUT"
          ./scripts/appcast.sh "$VERSION" "$SIG" "build/Bupsy-$VERSION.dmg" > build/appcast.xml

      # The notes say which kind of build this is, because the install steps differ. An unsigned
      # build that does not say so leaves people meeting Gatekeeper with no idea what to do.
      - name: Write the release notes
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          MODE=$(cat build/mode)
          SUM=$(cut -d' ' -f1 "build/Bupsy-$VERSION.dmg.sha256")
          # What's new: the version's Highlights from CHANGELOG.md, up to the marker that starts its
          # full list, so the notes stay short and the changelog stays the one place it's written.
          HIGHLIGHTS=$(awk -v v="## $VERSION " '
            index($0, v) == 1 { on = 1; next }
            on && (/^<!-- full changes below -->/ || /^## /) { exit }
            on { print }' CHANGELOG.md)
          {
            if [ -n "$(printf '%s' "$HIGHLIGHTS" | tr -d '[:space:]')" ]; then
              echo "## What's new"
              printf '%s\n' "$HIGHLIGHTS" | sed 's/^### Highlights$//'
              echo
              echo "Everything that changed: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/v$VERSION/CHANGELOG.md)"
              echo
            fi
            echo "## Install"
            echo
            echo "1. Download **Bupsy.dmg** below and open it."
            echo "2. Drag **Bupsy** into **Applications**."
            echo "3. Open Bupsy from Applications."
            echo
            if [ "$MODE" = "unsigned" ]; then
              echo "### The first time you open it"
              echo
              echo "This build is not yet notarized by Apple, so macOS will say it can't check"
              echo "it for malicious software. That is a missing Apple signature, not a problem"
              echo "with the app. To open it the first time:"
              echo
              echo "- Open **System Settings → Privacy & Security**, scroll down, and click"
              echo "  **Open Anyway** next to Bupsy. Confirm with your password."
              echo
              echo "Or, in Terminal:"
              echo
              echo '```'
              echo 'xattr -dr com.apple.quarantine /Applications/Bupsy.app'
              echo '```'
              echo
              echo "After that it opens normally. Notarized builds, which open with a"
              echo "double-click, come once there is an Apple Developer account."
            else
              echo "Signed and notarized by Xocket Labs Inc. It opens with a double-click."
            fi
            echo
            echo "## Requirements"
            echo
            echo "macOS 14 or later, on Apple Silicon or Intel. Bupsy runs your own"
            echo "[Claude Code](https://claude.com/claude-code) and Codex sign-ins — install and"
            echo "sign in to at least one."
            echo
            echo "---"
            echo
            echo "SHA-256 of \`Bupsy-$VERSION.dmg\`: \`$SUM\`"
          } > build/notes.md
          cat build/notes.md

      # Published to this repository by default. Set the RELEASE_REPO variable (and a
      # RELEASE_TOKEN secret with access to it) to publish to a separate public repository
      # instead — the way to offer public downloads while the source stays private.
      - name: Publish the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          repository: ${{ vars.RELEASE_REPO || github.repository }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          tag_name: v${{ steps.version.outputs.value }}
          name: Bupsy ${{ steps.version.outputs.value }}
          draft: ${{ steps.version.outputs.draft }}
          body_path: build/notes.md
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            build/Bupsy.dmg
            build/Bupsy-${{ steps.version.outputs.value }}.dmg
            build/Bupsy-${{ steps.version.outputs.value }}.dmg.sha256
            build/appcast.xml

      - name: Clean up the keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true
          # Read back the same way it was saved: one path per line, into an array, so a path with
          # a space survives the round trip.
          if [ -s "$RUNNER_TEMP/keychains.orig" ]; then
            ORIGINAL=()
            while IFS= read -r path; do
              if [ -n "$path" ]; then ORIGINAL+=("$path"); fi
            done < "$RUNNER_TEMP/keychains.orig"
            security list-keychains -d user -s ${ORIGINAL[@]+"${ORIGINAL[@]}"} || true
          fi
