name: Bug
description: Something in bupsy doesn't work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. A screenshot helps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: bupsy version
      description: bupsy menu → About bupsy
      placeholder: 0.1.0
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      options: [Claude Code, Codex, Both, Not engine-related]
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.2"
  - type: markdown
    attributes:
      value: >
        Please don't paste API keys, tokens or private conversations. bupsy never needs them to
        diagnose a bug.
